# Run Gazebo + ROS Noetic for Question 5
# From WSL/Linux: cd question5/docker, then:
#   docker-compose run --rm rosnoetic bash
# Inside container: bash /project/docker/build_and_launch.sh
# Then: roslaunch traveling_ethiopia_robot gazebo_world.launch
# Second terminal: docker-compose run --rm rosnoetic bash -c "source /catkin_ws/devel/setup.bash && rosrun traveling_ethiopia_robot path_planner.py"
# (Use a volume so /catkin_ws is persisted - see STEP_BY_STEP.md)

version: "3"
services:
  rosnoetic:
    build: .
    image: traveling_ethiopia_robot:noetic
    container_name: traveling_ethiopia_ros
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROS_MASTER_URI=http://localhost:11311
    volumes:
      # Mount project (question5) so build_and_launch.sh can copy package from /project
      - ..:/project:ro
      # Persist built workspace so you don't rebuild every time
      - ros_ws:/catkin_ws
      # So Gazebo can open a window (WSL/Linux)
      - /tmp/.X11-unix:/tmp/.X11-unix
    working_dir: /catkin_ws

volumes:
  ros_ws: {}
